# Runs the whole Well Priced pipeline in GitHub's cloud: no laptop needed.
# Daily at ~09:17 IST, or by hand: GitHub → Actions → "Daily reels" → Run workflow.
name: Daily reels
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      reels:
        description: "How many new reels"
        default: "3"
permissions:
  contents: write
concurrency:
  group: daily-reels
  cancel-in-progress: false
jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      SYNC: "0"
      GH_TOKEN: ${{ github.token }}
      HAS_PAT: ${{ secrets.GH_SECRETS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the Gemini key is set
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::Add GEMINI_API_KEY under Settings → Secrets and variables → Actions"; exit 1; fi
      - name: Plan and render new reels
        run: node scripts/auto.mjs "${{ github.event.inputs.reels || vars.REELS_PER_DAY || '3' }}"
        env:
          CATALOG_ONLY: "1"
          CATALOG_STALE_DAYS: "1"
        continue-on-error: true
      - name: Publish reels (render any missing, upload, link on the site)
        run: node scripts/cloud-publish.mjs
      - name: Post to Instagram (if IG_ACCESS_TOKEN is set)
        run: node scripts/ig-post.mjs
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_POSTS_PER_RUN: ${{ vars.IG_POSTS_PER_RUN || '1' }}
      - name: Keep the Instagram login alive
        if: ${{ env.HAS_PAT == 'true' }}
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          node scripts/ig-post.mjs refresh
          if [ -s "${RUNNER_TEMP:-/tmp}/ig_token" ] || [ -s /tmp/ig_token ]; then
            f=$( [ -s /tmp/ig_token ] && echo /tmp/ig_token || echo "$RUNNER_TEMP/ig_token" )
            gh secret set IG_ACCESS_TOKEN -R "$GITHUB_REPOSITORY" < "$f" && rm -f "$f" && echo "Saved refreshed token."
          fi
      - name: Save results
        run: |
          git config user.name "well-priced-bot"
          git config user.email "well-priced-bot@users.noreply.github.com"
          git add data public/catalog
          git diff --cached --quiet && exit 0
          git commit -m "daily run $(date -u +%F)"
          # if another run saved first, keep this run's data files
          git pull --rebase --autostash -X theirs || (git rebase --abort; git pull --no-rebase -X ours --no-edit)
          git push
