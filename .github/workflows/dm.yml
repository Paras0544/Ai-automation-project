# Comment-to-DM: every hour, DM the product links to anyone who commented LINK on a reel (last 7 days).
name: Comment to DM
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: comment-dm
  cancel-in-progress: false
jobs:
  dm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reply to LINK comments
        run: node scripts/dm.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841461989685675' }}
      - name: Save
        run: |
          git config user.name "well-priced-bot"
          git config user.email "well-priced-bot@users.noreply.github.com"
          git add data/learning/dm.json
          git diff --cached --quiet && exit 0
          git commit -m "dm replies $(date -u +%F-%H%M)"
          git pull --rebase --autostash -X theirs || (git rebase --abort; git pull --no-rebase -X ours --no-edit)
          git push
